<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bravo Shoes</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--surface); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .esp { fill:var(--espresso); }
  [data-theme="dark"] .esp { fill:var(--gold-soft); }
  .gold { fill:var(--gold); }
  .deep { fill:var(--gold-deep); }
  .soft { fill:var(--gold-soft); }
  .blk { rx:var(--radius-md); }
  .pill { fill:none; stroke:var(--gold); stroke-width:1; }
  .pill.on-soft { stroke:var(--gold-deep); }
  .words { position:absolute; left:var(--space-8); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-family:var(--font-display); font-size:104px; line-height:.95; font-weight:500; letter-spacing:-.01em; color:var(--ink); }
  .tag { margin:var(--space-2) 0 0 4px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      espresso 208×320 slab bled off top and bottom (the hero band) · gold 112×168 (the logo gold) · gold-deep 112×64 · gold-soft 160×120 bled off the right — ≈40% of 960×288
  arrangement one tall espresso slab with gold satellites stepping down to its right, space-4 gutters, bottoms on one line space-6 above the edge
  pattern     outlined pills, from "radius-pill belongs to tags only, the logo's rounded frame": six hairline pills (the BRAVO SHOES frame) stacked on the slab and two on the tint
  scales      sides in space-2 multiples; gutters space-4; pill height space-6 at a space-8 pitch; corners radius-md; pill rx half of space-6
-->
<rect class="esp" x="32" y="-16" width="208" height="320"/>
<rect class="gold blk" x="256" y="96" width="112" height="168" rx="4"/>
<rect class="deep blk" x="256" y="16" width="112" height="64" rx="4"/>
<rect class="soft blk" x="384" y="144" width="112" height="120" rx="4"/>
<rect class="pill" x="64" y="72" width="144" height="24" rx="12"/>
<rect class="pill" x="80" y="104" width="112" height="24" rx="12"/>
<rect class="pill" x="64" y="136" width="144" height="24" rx="12"/>
<rect class="pill" x="80" y="168" width="112" height="24" rx="12"/>
<rect class="pill" x="64" y="200" width="144" height="24" rx="12"/>
<rect class="pill" x="80" y="232" width="112" height="24" rx="12"/>
<rect class="pill on-soft" x="400" y="176" width="80" height="24" rx="12"/>
<rect class="pill on-soft" x="400" y="208" width="80" height="24" rx="12"/>
</svg>
</div>
<div class="words">
<h1 class="name">Bravo<br>Shoes</h1>
<p class="tag">Ivory, gold and a Didone serif — shoes for every step.</p>
</div>
</div>
</body>
</html>
