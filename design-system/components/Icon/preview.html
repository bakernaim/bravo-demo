<!doctype html>
<html>
<head><meta charset="utf-8"><title>Icon — preview</title>
<style>body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--font-sans)} #root{padding:24px;display:flex;gap:8px;flex-wrap:wrap}</style></head>
<body>
<div id="root"></div>
<script>
  var B = window.Bravo, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null, ['search','bag','heart','user','arrow','truck','swap','star','ruler'].map(function (n) {
    return h('div', { key: n, style: { display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 8, width: 64 } }, h(B.Icon, { name: n, className: '', }), h('span', { className: 'body-sm bv-muted' }, n));
  })));
</script>
</body>
</html>
